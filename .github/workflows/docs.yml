name: Documentation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation and run notebook quality gate
        run: make docs-build
